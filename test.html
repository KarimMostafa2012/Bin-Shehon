<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Three.js Tire Viewer – Blank Wall Fixed</title>
  <style>
    :root {
      --size: 400px;
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.98), rgba(229,232,237,.95));
      color: #17191c;
    }

    .card {
      width: max-content;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 18px 50px rgba(18, 23, 33, .16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
    }

    #viewer {
      width: var(--size);
      height: var(--size);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle at 50% 42%, rgba(255,255,255,.28), rgba(0,0,0,.03) 68%, rgba(0,0,0,.10));
      touch-action: none;
      cursor: grab;
    }

    #viewer.dragging { cursor: grabbing; }

    .toolbar {
      width: var(--size);
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .hint {
      margin: 0;
      font-size: 12px;
      line-height: 1.35;
      color: #5c6470;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    button {
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 999px;
      padding: 8px 12px;
      background: #17191c;
      color: white;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    @media (prefers-color-scheme: dark) {
      body {
        background: radial-gradient(circle at 50% 35%, #353941, #111318);
        color: #f5f6f8;
      }
      .card {
        background: rgba(26,28,32,.80);
        border-color: rgba(255,255,255,.08);
        box-shadow: 0 18px 50px rgba(0,0,0,.34);
      }
      .hint { color: #b8bec8; }
      button {
        background: #f4f5f7;
        color: #17191c;
        border-color: rgba(255,255,255,.12);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div id="viewer" aria-label="Interactive 3D tire viewer"></div>

    <div class="toolbar">
      <p class="hint">Drag horizontally to rotate.<br>Double-click to toggle auto spin.</p>
      <div class="buttons">
        <button id="spinButton" type="button">Pause spin</button>
        <button id="resetButton" type="button">Reset</button>
      </div>
    </div>
  </main>

    shadowGradient.addColorStop(0, "rgba(0,0,0,.48)");
    shadowGradient.addColorStop(0.46, "rgba(0,0,0,.16)");
    shadowGradient.addColorStop(1, "rgba(0,0,0,0)");

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    function cropAlphaBounds(image) {
      const canvas = document.createElement("canvas");
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(image, 0, 0);

      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let minX = canvas.width, minY = canvas.height, maxX = 0, maxY = 0, found = false;

      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const alpha = data[(y * canvas.width + x) * 4 + 3];
          if (alpha > 6) {
            found = true;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (!found) return canvas;

      const out = document.createElement("canvas");
      out.width = maxX - minX + 1;
      out.height = maxY - minY + 1;
      out.getContext("2d").drawImage(
        canvas,
        minX, minY, out.width, out.height,
        0, 0, out.width, out.height
      );
      return out;
    }

    function buildTreadCanvas(image) {
      /*
       * Rotate the tall tread photo to make the tread run around the cylinder.
       * Then repeat original/mirrored copies so the wrap never hits a blank edge.
       */
      const rotated = document.createElement("canvas");
      rotated.width = image.naturalHeight;
      rotated.height = image.naturalWidth;

      const rctx = rotated.getContext("2d");
      rctx.translate(rotated.width / 2, rotated.height / 2);
      rctx.rotate(-Math.PI / 2);
      rctx.drawImage(image, -image.naturalWidth / 2, -image.naturalHeight / 2);

      const wide = document.createElement("canvas");
      wide.width = rotated.width * 4;
      wide.height = rotated.height;
      const wctx = wide.getContext("2d");

      for (let i = 0; i < 4; i++) {
        const x = i * rotated.width;
        if (i % 2 === 0) {
          wctx.drawImage(rotated, x, 0);
        } else {
          wctx.save();
          wctx.translate(x + rotated.width, 0);
          wctx.scale(-1, 1);
          wctx.drawImage(rotated, 0, 0);
          wctx.restore();
        }
      }

      return wide;
    }

    function canvasToTexture(canvas) {
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.needsUpdate = true;
      return texture;
    }

    function createFaceTexture(canvas) {
      const texture = canvasToTexture(canvas);
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return texture;
    }

    function createTreadTexture(canvas) {
      const texture = canvasToTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      texture.repeat.set(0.5, 0.9);
      texture.offset.set(0.125, 0);
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      return texture;
    }

    loadingText.style.inset = "0";
    loadingText.style.display = "grid";
    loadingText.style.placeItems = "center";
    loadingText.style.font = "600 13px system-ui, sans-serif";
    loadingText.style.color = "rgba(90,96,106,.82)";
    viewer.appendChild(loadingText);

    Promise.all([loadImage(FACE_DATA_URL), loadImage(TREAD_DATA_URL)]).then(([faceImg, treadImg]) => {
      const faceCanvas = cropAlphaBounds(faceImg);
      const treadCanvas = buildTreadCanvas(treadImg);

      const faceTexture = createFaceTexture(faceCanvas);
      const rearFaceTexture = createFaceTexture(faceCanvas);
      const treadTexture = createTreadTexture(treadCanvas);

      const tireRadius = 1.68;
      const tireDepth = 0.90;
      const faceRadius = tireRadius * 1.001;
      const radialSegments = 192;
      const faceOffset = tireDepth / 2 + 0.012;
      const backingOffset = tireDepth / 2 - 0.040;

      /*
       * Key fix:
       * Use a separate OPEN-ENDED tread cylinder plus separate front/rear face discs.
       * This avoids the "blank wall" problem caused by cylinder end geometry appearing
       * at some angles.
       */
      const treadMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(tireRadius, tireRadius, tireDepth, radialSegments, 1, true),
        new THREE.MeshStandardMaterial({
          map: treadTexture,
          roughness: 0.92,
          metalness: 0.03,
          side: THREE.DoubleSide
        })
      );
      treadMesh.rotation.z = Math.PI / 2;
      tireGroup.add(treadMesh);

      const frontFace = new THREE.Mesh(
        new THREE.CircleGeometry(faceRadius, 128),
        new THREE.MeshStandardMaterial({
          map: faceTexture,
          transparent: true,
          side: THREE.DoubleSide,
          roughness: 0.72,
          metalness: 0.08
        })
      );
      frontFace.rotation.y = -Math.PI / 2;
      frontFace.position.x = faceOffset;
      tireGroup.add(frontFace);

      const rearFace = new THREE.Mesh(
        new THREE.CircleGeometry(faceRadius, 128),
        new THREE.MeshStandardMaterial({
          map: rearFaceTexture,
          transparent: true,
          side: THREE.DoubleSide,
          roughness: 0.72,
          metalness: 0.08
        })
      );
      rearFace.rotation.y = Math.PI / 2;
      rearFace.position.x = -faceOffset;
      tireGroup.add(rearFace);

      const backingMaterial = new THREE.MeshStandardMaterial({
        color: 0x171a1d,
        roughness: 1,
        metalness: 0,
        side: THREE.DoubleSide
      });

      const frontBacking = new THREE.Mesh(
        new THREE.CircleGeometry(tireRadius * 0.985, 128),
        backingMaterial
      );
      frontBacking.rotation.y = -Math.PI / 2;
      frontBacking.position.x = backingOffset;
      tireGroup.add(frontBacking);

      const rearBacking = new THREE.Mesh(
        new THREE.CircleGeometry(tireRadius * 0.985, 128),
        backingMaterial
      );
      rearBacking.rotation.y = Math.PI / 2;
      rearBacking.position.x = -backingOffset;
      tireGroup.add(rearBacking);

      const innerCavity = new THREE.Mesh(
        new THREE.CylinderGeometry(tireRadius * 0.56, tireRadius * 0.56, tireDepth * 0.92, 96),
        new THREE.MeshStandardMaterial({
          color: 0x0d0f11,
          roughness: 1,
          metalness: 0
        })
      );
      innerCavity.rotation.z = Math.PI / 2;
      tireGroup.add(innerCavity);

      /*
       * Thin shoulder rings hide tiny seams between the face discs and the tread cylinder.
       */
      const ringMaterial = new THREE.MeshStandardMaterial({
        color: 0x202428,
        roughness: 0.95,
        metalness: 0.02,
        side: THREE.DoubleSide
      });

      const frontRing = new THREE.Mesh(
        new THREE.TorusGeometry(tireRadius * 0.985, 0.035, 16, 96),
        ringMaterial
      );
      frontRing.rotation.y = Math.PI / 2;
      frontRing.position.x = tireDepth / 2 + 0.004;
      tireGroup.add(frontRing);

      const rearRing = new THREE.Mesh(
        new THREE.TorusGeometry(tireRadius * 0.985, 0.035, 16, 96),
        ringMaterial
      );
      rearRing.rotation.y = Math.PI / 2;
      rearRing.position.x = -tireDepth / 2 - 0.004;
      tireGroup.add(rearRing);

      viewer.removeChild(loadingText);
    }).catch((error) => {
      loadingText.textContent = "Failed to load textures.";
      console.error(error);
    });

    function updateSpinButton() {
      spinButton.textContent = autoSpin ? "Pause spin" : "Auto spin";
    }
    updateSpinButton();

    function onPointerDown(event) {
      isDragging = true;
      viewer.classList.add("dragging");
      autoSpin = false;
      updateSpinButton();
      startX = event.clientX;
      startRotation = targetRotationY;
      viewer.setPointerCapture(event.pointerId);
    }

    function onPointerMove(event) {
      if (!isDragging) return;
      const delta = (event.clientX - startX) / WIDTH;
      targetRotationY = startRotation + delta * Math.PI * 2.1;
    }

    function endDrag(event) {
      if (!isDragging) return;
      isDragging = false;
      viewer.classList.remove("dragging");
      if (viewer.hasPointerCapture(event.pointerId)) {
        viewer.releasePointerCapture(event.pointerId);
      }
    }

    viewer.addEventListener("pointerdown", onPointerDown);
    viewer.addEventListener("pointermove", onPointerMove);
    viewer.addEventListener("pointerup", endDrag);
    viewer.addEventListener("pointercancel", endDrag);

    viewer.addEventListener("dblclick", () => {
      autoSpin = !autoSpin;
      updateSpinButton();
    });

    spinButton.addEventListener("click", () => {
      autoSpin = !autoSpin;
      updateSpinButton();
    });

    resetButton.addEventListener("click", () => {
      targetRotationY = 0.55;
    });

    let lastTime = performance.now();

    function animate(now) {
      const delta = Math.min(40, now - lastTime);
      lastTime = now;

      if (autoSpin) {
        targetRotationY += delta * 0.00095 * Math.PI;
      }

      tireGroup.rotation.y += (targetRotationY - tireGroup.rotation.y) * 0.14;
      shadowMesh.rotation.z = -tireGroup.rotation.y * 0.05;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
